# Non-secret settings for Cloud Run. Copy to deploy/env.yaml (git-ignored) and edit.
# Secrets (GEMINI_API_KEY, APIFY_TOKEN, RAPIDAPI_KEY) come from Secret Manager, see deploy/setup.sh.
# Values must be strings.
NEEDL_SOURCE: "live"
# "real" is not implemented yet: results still contain the sample checks.
NEEDL_ANALYZER: "stub"
GOOGLE_CLOUD_PROJECT: "your-project-id"
FIRESTORE_DATABASE: "(default)"
# Cloud Run's /tmp is in memory and belongs to the instance.
UPLOAD_DIR: "/tmp/needl-uploads"
# Origin(s) of the deployed UI, comma-separated, no trailing slash.
CORS_ORIGINS: "https://your-ui.example.com"
# Cloud Run adds the client IP as the last X-Forwarded-For entry. Use 2 behind an external load balancer.
TRUST_FORWARDED_FOR: "true"
TRUSTED_PROXY_HOPS: "1"
# The legacy endpoints need Chromium, which the image does not include.
ENABLE_LEGACY_ROUTES: "false"
# 1-30; Cloud Run rejects HTTP/1 requests over 32 MiB.
MAX_UPLOAD_TOTAL_MB: "30"
WORKER_COUNT: "2"
JOB_TIMEOUT_S: "180"
RATE_CREATE_PER_MIN: "10"
RATE_POLL_PER_MIN: "60"
SHOPEE_PROVIDERS: "apify,rapidapi"
# Only when using RapidAPI (RAPIDAPI_KEY in Secret Manager): endpoint templates, see README section 5.
# Without RAPIDAPI_SHOPEE_DETAIL_URL the RapidAPI provider is skipped.
# RAPIDAPI_SHOPEE_DETAIL_URL: "https://<host>.p.rapidapi.com/<path>?shop_id={shop_id}&item_id={item_id}"
# RAPIDAPI_SHOPEE_REVIEWS_URL: "https://<host>.p.rapidapi.com/<path>?shop_id={shop_id}&item_id={item_id}&limit={limit}"
GEMINI_MODEL: "gemini-2.5-flash"
# Spending cap per Apify actor run.
APIFY_MAX_CHARGE_USD: "0.50"
